# Redis 本地开发配置
# 对应 docker-compose.yml 中的挂载路径 ./redis/redis.conf

# 绑定所有网卡（Docker 容器内）
bind 0.0.0.0

# 保护模式关闭（Docker 内部网络已隔离）
protected-mode no

# 端口
port 6379

# 连接超时（0 = 永不超时）
timeout 0

# TCP 保活
tcp-keepalive 300

# 日志级别：verbose / debug / notice / warning
loglevel notice

# 最大内存（本地开发限 256MB，生产按需调整）
maxmemory 256mb

# 内存淘汰策略：LRU 淘汰最近最少使用的 Key
maxmemory-policy allkeys-lru

# ── AOF 持久化（数据安全）─────────────────────────────────────
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec          # 每秒同步一次（性能与安全平衡）
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ── RDB 快照（额外兜底）──────────────────────────────────────
save 900 1
save 300 10
save 60  10000
