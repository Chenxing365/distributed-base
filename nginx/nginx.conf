# =================================================================
# nginx.conf — 生产级 Nginx 配置
#
# 职责：
#   1. 静态资源服务（UniApp H5 构建产物）
#   2. 后端两个 Spring Boot 实例负载均衡轮询（8080 / 8081）
#   3. /ws/ 路径 WebService (SOAP) 透明代理
#   4. 完整跨域响应头（CORS）
#   5. Gzip 压缩
# =================================================================

worker_processes  auto;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── 日志格式 ──────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'uht=$upstream_header_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    # ── 基础性能 ────────────────────────────────────────────────
    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20m;

    # ── Gzip 压缩 ───────────────────────────────────────────────
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_buffers       16  8k;
    gzip_http_version  1.1;
    gzip_min_length    256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/xml+rss application/atom+xml
        image/svg+xml font/woff font/woff2;

    # ── 后端 Upstream：两个 Spring Boot 实例轮询负载均衡 ────────
    upstream backend_pool {
        # 轮询策略（默认）
        server  127.0.0.1:8080  weight=1  max_fails=3  fail_timeout=30s;
        server  127.0.0.1:8081  weight=1  max_fails=3  fail_timeout=30s;

        # 连接保持复用
        keepalive  32;
    }

    # ── 跨域公共 Map（根据请求来源动态设置）─────────────────────
    map $http_origin $cors_origin {
        default  "";
        ~^https?://(localhost|127\.0\.0\.1)(:\d+)?$  $http_origin;
        ~^https?://your-domain\.com$                  $http_origin;
    }

    # ── 主 Server Block ─────────────────────────────────────────
    server {
        listen       80;
        server_name  localhost;
        charset      utf-8;

        # ── 跨域响应头（添加到所有 /api 与 /ws 路径）────────────
        add_header  Access-Control-Allow-Origin      $cors_origin  always;
        add_header  Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS, PATCH"  always;
        add_header  Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With, Accept, Origin"  always;
        add_header  Access-Control-Allow-Credentials "true"  always;
        add_header  Access-Control-Max-Age           "3600"  always;

        # 预检请求快速返回
        if ($request_method = OPTIONS) {
            return 204;
        }

        # ── 静态资源：UniApp H5 构建产物 ─────────────────────────
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            # HTML5 History 路由：所有未匹配路由回退到 index.html
            try_files $uri $uri/ /index.html;

            # 静态资源强缓存（带 hash 的文件名）
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires  1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        # ── REST API 代理：转发到后端 Upstream ───────────────────
        location /api/ {
            proxy_pass          http://backend_pool;
            proxy_http_version  1.1;
            proxy_set_header    Connection        "";
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;

            proxy_connect_timeout  10s;
            proxy_read_timeout     60s;
            proxy_send_timeout     60s;

            # 后端返回错误时尝试下一个实例
            proxy_next_upstream  error timeout http_500 http_502 http_503;
        }

        # ── WebService (SOAP) 代理：/ws/ 路径转发 ────────────────
        location /ws/ {
            proxy_pass          http://backend_pool;
            proxy_http_version  1.1;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_set_header    SOAPAction        $http_soapaction;

            proxy_connect_timeout  10s;
            proxy_read_timeout     120s;   # SOAP 请求允许更长超时

            # WSDL 请求不缓存
            add_header  Cache-Control "no-cache, no-store";
        }

        # ── Swagger UI 代理 ───────────────────────────────────────
        location /swagger-ui/ {
            proxy_pass  http://backend_pool;
            proxy_set_header  Host  $host;
        }

        location /v3/api-docs {
            proxy_pass  http://backend_pool;
            proxy_set_header  Host  $host;
        }

        # ── 健康检查端点 ─────────────────────────────────────────
        location /health {
            access_log  off;
            return 200  '{"status":"UP","service":"nginx-gateway"}';
            add_header  Content-Type  application/json;
        }

        # ── 错误页面 ──────────────────────────────────────────────
        error_page  404               /404.html;
        error_page  500 502 503 504   /50x.html;

        location = /404.html { root /usr/share/nginx/html; internal; }
        location = /50x.html { root /usr/share/nginx/html; internal; }
    }
}
